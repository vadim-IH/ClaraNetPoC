<script>const SALT='F/pPBw5SUaqIxlAUYESi7g==',IT=250000,SHIM="<script>(()=>{const K=crypto.subtle.importKey('raw',Uint8Array.from(atob('%KEY%'),c=>c.charCodeAt(0)),'AES-GCM',false,['decrypt']);\nconst of=window.fetch.bind(window);const cache={};const rel=u=>typeof u==='string'&&u&&!/^(blob:|data:|https?:|\\/\\/)/.test(u);\nconst ver=()=>{const m=document.querySelector('meta[name=omx-ver]');return m?m.content:''};\nconst dec=u=>cache[u]||(cache[u]=of(u+'.enc?v='+ver()).then(r=>{if(!r.ok)throw new Error(u);return r.arrayBuffer()}).then(async b=>{const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(b,0,12)},await K,new Uint8Array(b,12));return p}));\nconst typ=u=>/\\.mp4$/.test(u)?'video/mp4':/\\.jpe?g$/.test(u)?'image/jpeg':/\\.png$/.test(u)?'image/png':/\\.webp$/.test(u)?'image/webp':/\\.svg$/.test(u)?'image/svg+xml':/\\.json$/.test(u)?'application/json':'text/plain';\nconst url=u=>dec(u).then(p=>URL.createObjectURL(new Blob([p],{type:typ(u)})));window.__dec=url;\nwindow.fetch=(u,o)=>rel(u)?dec(u).then(p=>new Response(p)):of(u,o);\nfor(const [P,a] of [[HTMLMediaElement.prototype,'src'],[HTMLVideoElement.prototype,'poster'],[HTMLImageElement.prototype,'src']]){\n const d=Object.getOwnPropertyDescriptor(P,a);Object.defineProperty(P,a,{get(){return d.get.call(this)},set(u){if(!rel(u))return d.set.call(this,u);\n  this['__w'+a]=u;const media=a==='src'&&this instanceof HTMLMediaElement;if(media){this.removeAttribute('src');this.load();}\n  url(u).then(b=>{if(this['__w'+a]!==u)return;d.set.call(this,b);if(media&&this.closest('dialog[open]'))this.play().catch(()=>{});})\n  .catch(()=>{delete cache[u];if(media&&this['__w'+a]===u)this.dispatchEvent(new CustomEvent('omxfail'));});}});}\nconst bg=el=>{const m=(el.getAttribute('style')||'').match(/url\\(['\"]?([^'\")]+)['\"]?\\)/);if(m&&rel(m[1])){const u=m[1];el.style.backgroundImage='none';url(u).then(b=>el.style.backgroundImage=`url('${b}')`);}};\nconst scan=r=>{(r.querySelectorAll?r:document).querySelectorAl const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(SALT),iterations:IT,hash:'SHA-256'},m,256));}
async function open_(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
 const b=await (await fetch('index.html.enc?t='+Date.now(),{cache:'no-store'})).arrayBuffer();
